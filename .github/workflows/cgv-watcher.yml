name: CGV IMAX Watcher

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cgv-imax-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Do not retry a timed-out apt installation: its privileged child process
      # can retain the dpkg lock and make subsequent attempts fail.
      - name: Install Chromium system dependencies
        timeout-minutes: 2
        run: pnpm exec playwright install-deps chromium

      - name: Install Chromium
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Installing Chromium (attempt ${attempt}/3, timeout: 60s)..."
            if timeout --kill-after=5s 60s pnpm exec playwright install chromium; then
              exit 0
            else
              status=$?
              echo "Chromium installation attempt ${attempt} failed (exit code: ${status})."
            fi

            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 10))
              echo "Retrying in ${delay}s..."
              sleep "$delay"
            fi
          done

          echo "Chromium installation failed after 3 attempts."
          exit 1

      - name: Type check
        run: pnpm typecheck

      - name: Run watcher
        run: xvfb-run -a pnpm start
        env:
          HEADLESS: 'false'
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cgv-failure
          path: cgv-failure.png
          if-no-files-found: ignore
